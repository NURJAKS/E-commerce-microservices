name: E-Commerce Monorepo CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
    tags: ['v*']
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io

jobs:
  # ============================================================================
  # Stage 0: Secret Scanning (Gitleaks)
  # ============================================================================
  secret-scan:
    name: "Stage 0: Gitleaks Secret Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (Full History for Gitleaks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ============================================================================
  # Stage 1: Lint, Typecheck & Build (ESLint + tsc --noEmit + Vite Build)
  # ============================================================================
  lint-and-typecheck:
    name: "Stage 1: Lint, Typecheck & Build"
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma Clients
        run: npm run prisma:generate

      - name: Run ESLint (0 warnings allowed)
        run: npm run lint

      - name: Run TypeScript Typecheck (Backend & Shared Libs)
        run: npm run typecheck

      - name: Build Full Monorepo (Backend + Vue 3 SPA)
        run: npm run build

  # ============================================================================
  # Stage 2: Unit & Supertest Integration Tests (Vitest >= 80% Coverage Gate)
  # ============================================================================
  tests-and-coverage:
    name: "Stage 2: Vitest Unit & Supertest (>= 80% Gate)"
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma Clients
        run: npm run prisma:generate

      - name: Run Vitest with >= 80% Coverage Gate Enforcement
        run: npm run test:coverage

  # ============================================================================
  # Stage 3: Real PostgreSQL 16 + Redis 7 Integration Tests
  # (10-way Optimistic Locking Race, Inbox Pattern, pg_trgm Search, Reviews, Alerts)
  # ============================================================================
  postgres-integration-tests:
    name: "Stage 3: Real PostgreSQL & Redis Integration Tests"
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_password
          POSTGRES_DB: catalog_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      CATALOG_DATABASE_URL: postgresql://postgres:ci_postgres_password@localhost:5432/catalog_db?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma Clients
        run: npm run prisma:generate

      - name: Push Catalog Prisma Schema to Real PostgreSQL
        run: npx prisma db push --schema=apps/catalog-service/prisma/schema.prisma --skip-generate

      - name: Run Real PostgreSQL Concurrency, Inbox, pg_trgm & Saga Tests
        run: npm run test:integration

  # ============================================================================
  # Stage 4: Hardened Multi-Stage Docker Build, Trivy Scan & GHCR Publish (CD)
  # ============================================================================
  docker-build-and-publish:
    name: "Stage 4: Docker Build, Security Scan & Publish (${{ matrix.service }})"
    runs-on: ubuntu-latest
    needs: [tests-and-coverage, postgres-integration-tests]
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            dockerfile: docker/backend.Dockerfile
          - service: auth-service
            dockerfile: docker/backend.Dockerfile
          - service: catalog-service
            dockerfile: docker/backend.Dockerfile
          - service: order-service
            dockerfile: docker/backend.Dockerfile
          - service: payment-service
            dockerfile: docker/backend.Dockerfile
          - service: notification-service
            dockerfile: docker/backend.Dockerfile
          - service: client
            dockerfile: apps/client/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (tags & OCI labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build (PR verify) / Build & Push (main/tags) Multi-Stage Docker Image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            APP_NAME=${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Run Trivy Container Vulnerability Scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
        continue-on-error: true
