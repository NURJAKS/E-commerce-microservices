map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP/1.1 keepalive pool prevents ephemeral TCP port exhaustion (errno 99) under high RPS
upstream api_gateway_backend {
    server api-gateway:3000;
    keepalive 128;
    keepalive_requests 10000;
    keepalive_timeout 60s;
}

server {
    listen 80;
    # Wildcard server_name works for localhost, raw VPS IPs, and any custom internet domain
    server_name _;

    # Dynamically re-resolve Docker container IPs every 10s
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 20M;

    # Gzip compression for fast WAN / internet delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # API Gateway Reverse Proxy (/api/*) with HTTP/1.1 keepalive connection pooling
    location /api/ {
        proxy_pass http://api_gateway_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MinIO Public Media Reverse Proxy (/products-media/*)
    # Preserves exact $http_host so S3v4 Presigned PUT uploads match browser Host over HTTPS
    location /products-media/ {
        set $minio_upstream http://minio:9000;
        proxy_pass $minio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MinIO Private Invoices Reverse Proxy (/invoices-private/*)
    # Serves 60s S3v4 Presigned GET PDF receipts over HTTPS without exposing port 9000 publicly
    location /invoices-private/ {
        set $minio_upstream http://minio:9000;
        proxy_pass $minio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets Reverse Proxy (/socket.io/*)
    location /socket.io/ {
        set $notification_ws_upstream http://notification-service:3005;
        proxy_pass $notification_ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # Vue 3 SPA Static Assets & History API Fallback
    location / {
        set $client_upstream http://client:80;
        proxy_pass $client_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 404 = /index.html;
    }
}
