map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    # Dynamically re-resolve Docker container IPs every 10s to avoid 502 after container recreations
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 20M;

    # API Gateway Reverse Proxy (/api/*)
    location /api/ {
        set $api_gateway_upstream http://api-gateway:3000;
        proxy_pass $api_gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MinIO Public Media Reverse Proxy (/products-media/*)
    location /products-media/ {
        set $minio_upstream http://minio:9000;
        proxy_pass $minio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSockets Reverse Proxy (/socket.io/*)
    location /socket.io/ {
        set $notification_ws_upstream http://notification-service:3005;
        proxy_pass $notification_ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # Vue 3 SPA Static Assets & Fallback
    location / {
        set $client_upstream http://client:80;
        proxy_pass $client_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_intercept_errors on;
        error_page 404 = /index.html;
    }
}
