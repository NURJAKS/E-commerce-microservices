services:
  postgres:
    image: postgres:16-alpine
    container_name: shop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multi-db.sql:/docker-entrypoint-initdb.d/init-multi-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: shop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: shop-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 15

  minio:
    image: alpine/minio:latest-release
    container_name: shop-minio
    restart: unless-stopped
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: shop-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8025"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        APP_NAME: auth-service
    container_name: shop-auth-service
    restart: unless-stopped
    environment:
      APP_NAME: auth-service
      AUTH_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/auth_db?schema=public
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWT_ACCESS_SECRET: super-secret-jwt-access-key-shop-2026
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_TTL_DAYS: "7"
      AUTH_SERVICE_HOST: 0.0.0.0
      AUTH_SERVICE_PORT: "3001"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3001 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  catalog-service:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        APP_NAME: catalog-service
    container_name: shop-catalog-service
    restart: unless-stopped
    environment:
      APP_NAME: catalog-service
      CATALOG_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/catalog_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      CATALOG_SERVICE_HOST: 0.0.0.0
      CATALOG_SERVICE_PORT: "3002"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3002 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        APP_NAME: order-service
    container_name: shop-order-service
    restart: unless-stopped
    environment:
      APP_NAME: order-service
      ORDER_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/order_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      CATALOG_SERVICE_HOST: catalog-service
      CATALOG_SERVICE_PORT: "3002"
      ORDER_SERVICE_HOST: 0.0.0.0
      ORDER_SERVICE_PORT: "3003"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3003 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      catalog-service:
        condition: service_healthy

  payment-service:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        APP_NAME: payment-service
    container_name: shop-payment-service
    restart: unless-stopped
    environment:
      APP_NAME: payment-service
      PAYMENT_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/payment_db?schema=public
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      PAYMENT_SERVICE_HOST: 0.0.0.0
      PAYMENT_SERVICE_PORT: "3004"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3004 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        APP_NAME: notification-service
    container_name: shop-notification-service
    restart: unless-stopped
    environment:
      APP_NAME: notification-service
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWT_ACCESS_SECRET: super-secret-jwt-access-key-shop-2026
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: no-reply@shop-monorepo.local
      NOTIFICATION_SERVICE_PORT: "3005"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3005/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        APP_NAME: api-gateway
    container_name: shop-api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      APP_NAME: api-gateway
      API_GATEWAY_PORT: "3000"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_ACCESS_SECRET: super-secret-jwt-access-key-shop-2026
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: "3001"
      CATALOG_SERVICE_HOST: catalog-service
      CATALOG_SERVICE_PORT: "3002"
      ORDER_SERVICE_HOST: order-service
      ORDER_SERVICE_PORT: "3003"
      PAYMENT_SERVICE_HOST: payment-service
      PAYMENT_SERVICE_PORT: "3004"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: http://localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: products-media
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      minio:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    container_name: shop-client
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: shop-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      client:
        condition: service_started
      api-gateway:
        condition: service_healthy
      notification-service:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
