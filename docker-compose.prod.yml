# Production Docker Compose manifest — pulls immutable images published by CI/CD to GHCR.
# Supply real secrets via a server-only `.env` file (`chmod 600 /opt/novashop/.env`).
# See `.env.prod.example` for every variable required for public internet deployment.
#
# Horizontal scaling works out of the box (no fixed `container_name` on stateless services):
#   docker compose -f docker-compose.prod.yml up -d
#   (adjust API_GATEWAY_REPLICAS / CATALOG_REPLICAS / ORDER_REPLICAS in `.env`)
services:
  postgres:
    image: postgres:16-alpine
    container_name: shop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multi-db.sql:/docker-entrypoint-initdb.d/init-multi-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: shop-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: shop-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-novashop}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 15

  minio:
    image: alpine/minio:latest-release
    container_name: shop-minio
    restart: unless-stopped
    # Not exposed directly to the public internet; served via Nginx /products-media/ and /invoices-private/
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    image: ${GHCR_PREFIX:?GHCR_PREFIX is required}-auth-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    deploy:
      replicas: ${AUTH_REPLICAS:-1}
    environment:
      APP_NAME: auth-service
      NODE_ENV: production
      AUTH_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/auth_db?schema=public
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-novashop}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY is required}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      SEED_DEFAULT_ADMIN: ${SEED_DEFAULT_ADMIN:-false}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
      AUTH_SERVICE_HOST: 0.0.0.0
      AUTH_SERVICE_PORT: "3001"
      AUTH_HEALTH_PORT: "3101"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3101/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  catalog-service:
    image: ${GHCR_PREFIX}-catalog-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    deploy:
      replicas: ${CATALOG_REPLICAS:-2}
    environment:
      APP_NAME: catalog-service
      NODE_ENV: production
      CATALOG_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/catalog_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-novashop}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      CATALOG_SERVICE_HOST: 0.0.0.0
      CATALOG_SERVICE_PORT: "3002"
      CATALOG_HEALTH_PORT: "3102"
      # Set to your public HTTPS domain (e.g. https://shop.example.com) so Nginx proxies /products-media/* over TLS
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:?MINIO_PUBLIC_URL is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-products-media}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3102/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  order-service:
    image: ${GHCR_PREFIX}-order-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    deploy:
      replicas: ${ORDER_REPLICAS:-2}
    environment:
      APP_NAME: order-service
      NODE_ENV: production
      ORDER_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/order_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-novashop}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      CATALOG_SERVICE_HOST: catalog-service
      CATALOG_SERVICE_PORT: "3002"
      ORDER_SERVICE_HOST: 0.0.0.0
      ORDER_SERVICE_PORT: "3003"
      ORDER_HEALTH_PORT: "3103"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_INVOICE_BUCKET: ${MINIO_INVOICE_BUCKET:-invoices-private}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3103/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      minio:
        condition: service_healthy

  payment-service:
    image: ${GHCR_PREFIX}-payment-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    deploy:
      replicas: ${PAYMENT_REPLICAS:-1}
    environment:
      APP_NAME: payment-service
      NODE_ENV: production
      PAYMENT_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/payment_db?schema=public
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-novashop}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      PAYMENT_SERVICE_HOST: 0.0.0.0
      PAYMENT_SERVICE_PORT: "3004"
      PAYMENT_HEALTH_PORT: "3104"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:?FRONTEND_PUBLIC_URL is required}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3104/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    image: ${GHCR_PREFIX}-notification-service:${IMAGE_TAG:-latest}
    container_name: shop-notification-service
    restart: unless-stopped
    environment:
      APP_NAME: notification-service
      NODE_ENV: production
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-novashop}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL}
      ALLOW_PUBLIC_SAGA_MONITOR: ${ALLOW_PUBLIC_SAGA_MONITOR:-false}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@novashop.local}
      NOTIFICATION_SERVICE_PORT: "3005"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_INVOICE_BUCKET: ${MINIO_INVOICE_BUCKET:-invoices-private}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3005/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  api-gateway:
    image: ${GHCR_PREFIX}-api-gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    deploy:
      replicas: ${API_GATEWAY_REPLICAS:-2}
    environment:
      APP_NAME: api-gateway
      NODE_ENV: production
      API_GATEWAY_PORT: "3000"
      LOG_HTTP_REQUESTS: ${LOG_HTTP_REQUESTS:-false}
      SLOW_HTTP_LOG_MS: ${SLOW_HTTP_LOG_MS:-250}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: "3001"
      CATALOG_SERVICE_HOST: catalog-service
      CATALOG_SERVICE_PORT: "3002"
      ORDER_SERVICE_HOST: order-service
      ORDER_SERVICE_PORT: "3003"
      PAYMENT_SERVICE_HOST: payment-service
      PAYMENT_SERVICE_PORT: "3004"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-products-media}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      minio:
        condition: service_healthy

  client:
    image: ${GHCR_PREFIX}-client:${IMAGE_TAG:-latest}
    container_name: shop-client
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: shop-nginx
    restart: unless-stopped
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      client:
        condition: service_started
      api-gateway:
        condition: service_healthy
      notification-service:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
